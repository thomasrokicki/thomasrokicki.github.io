# Single source of truth for the website (public/index.html) and the CV (public/files/cv_*.pdf).
# After editing, run `make` from the repository root.
#
# Text fields may be a plain string or a {en: ..., fr: ...} map; the CV picks the
# language, the website always uses `en`. Quote any value containing ": ".
# Any value containing TODO is rendered in red in the CV and reported by `make`.
#
# Link kinds: pdf, code, video, website, thesis (website/CV icons and labels).
# Local links (no http://) are relative to the website root (public/) and must exist.

profile:
  name: Thomas Rokicki
  title: Cybersecurity Researcher        # website sidebar
  email: thomas.rokicki@irisa.fr
  location: Rennes, France
  website: https://thomas.rokicki.fr
  # Website sidebar icons, in order. `cv: true` also shows the link in the CV header.
  links:
    - {kind: github, url: "https://github.com/thomasrokicki", cv: true}
    - {kind: twitter, url: "https://twitter.com/ThomasRokicki"}
    - {kind: linkedin, url: "https://www.linkedin.com/in/thomas-rokicki/"}
    - {kind: scholar, url: "https://scholar.google.com/citations?user=eg9v2KQAAAAJ", cv: true}
    - {kind: cv, url: files/cv_thomas_rokicki.pdf}

